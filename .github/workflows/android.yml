name: Android build
on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'scripts/build-android.mjs'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'
  push:
    branches: [develop]
    paths:
      - 'android/**'
      - 'src/**'
      - 'scripts/build-android.mjs'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: output/android/
          if-no-files-found: error
          retention-days: 14
