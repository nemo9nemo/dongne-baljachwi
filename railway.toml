"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/sharing/Dockerfile"
watchPatterns = ["scripts/sharing/**", "deploy/sharing/**", ".dockerignore", "railway.toml"]

[deploy]
healthcheckPath = "/api/device-share/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
